name: Release patched Istio images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Istio upstream tag with a matching patches/<tag> branch"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout upstream Istio tag
        uses: actions/checkout@v4
        with:
          repository: istio/istio
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Apply the release-specific patch
        run: |
          set -euo pipefail
          git remote add fork "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags fork "refs/heads/patches/$UPSTREAM_TAG"
          if [[ "$(git rev-list --parents -n 1 FETCH_HEAD)" != "$(git rev-parse FETCH_HEAD) $(git rev-parse HEAD)" ]]; then
            echo "patches/$UPSTREAM_TAG must contain a single patch on top of the upstream tag" >&2
            exit 1
          fi
          git merge --ff-only FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test ambient gateway selection
        run: go test ./pilot/pkg/serviceregistry/ambient

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag, build, and publish patched Pilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export HUB="ghcr.io/$GITHUB_REPOSITORY"
          export TAG="$UPSTREAM_TAG-streamx"
          git tag "$TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"
          make push.docker.pilot
